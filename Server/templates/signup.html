<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <title>VideoHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reset-min.css') }}">
  <link rel='stylesheet prefetch' href="{{ url_for('static', filename='css/roboto.css') }}">
  <link rel='stylesheet prefetch' href="{{ url_for('static', filename='css/monsterrat.css') }}">
  <link rel='stylesheet prefetch' href="{{ url_for('static', filename='css/font-awesome.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/alert.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>

<body>
    <div class="container">
      <div class="info">
        <h1 style="color:#16A085;">VideoHub</h1>
      </div>
    </div>
    <div class="form">
      <form class="login-form" action="signup" method="post">
        {% if signupError %}
          <div class="alert">
            <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
            Username already present
          </div>
        {% endif %}
        <input type="text" name="username" placeholder="username" required autofocus/>
        <input type="password" name="password" placeholder="password" required/>
        <button>create</button>
        <p class="message">Already registered? <a href="{{ url_for('login_form') }}">Login to account</a></p>
      </form>
    </div>
</body>
</html>
