<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>VideoHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/third-party/pure-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/styles.css" type="text/css">
  <link rel="stylesheet" href="/static/css/alert.css" type="text/css">
  <link rel="icon" href="/static/img/favicon.png" type="image/png">
</head>

<body>
  <div class="content">
    <div class="info">
      <a href="/">
        <h1>VideoHub</h1>
      </a>

      <form class="pure-form pure-form-aligned" action="/add-user?admin={{ admin }}" method="post">
        <fieldset>
          {% if create_error %}
          <div class="alert pure-control-group">
            <span class="close-button" onclick="this.parentElement.style.display='none';">&times;</span>
            Passwords do not match
          </div>
          {% else if invalid_username %}
          <div class="alert pure-control-group">
            <span class="close-button" onclick="this.parentElement.style.display='none';">&times;</span>
            Username already taken
          </div>
          {% endif %}
          <div class="pure-control-group">
            <input class="pure-input-1" type="text" name="username" placeholder="username" required autofocus />
          </div>
          <div class="pure-control-group">
            <input class="pure-input-1" type="password" name="password" placeholder="password" required />
          </div>
          <div class="pure-control-group">
            <input class="pure-input-1" type="password" name="confirm-password" placeholder="password" required />
          </div>
          <div class="pure-control-group">
            <button class="pure-input-1 button pure-button">Create</button>
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</body>

</html>
