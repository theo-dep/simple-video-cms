<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>VideoHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/third-party/pure-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/third-party/grids-responsive-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/styles.css" type="text/css">
  <link rel="icon" href="/static/img/favicon.png" type="image/png">
</head>

<body>

  <div class="header pure-g">
    <div class="pure-u-1 pure-u-md-2-3">
      <div class="pure-menu pure-menu-horizontal">
        <a href="/" class="menu-link pure-menu-heading pure-menu-link">VideoHub</a>

        <ul class="menu-list pure-menu-list">
          <li class="pure-menu-item">
            {% if not is_logged %}
            <a href="/login" class="menu-link pure-menu-link">Login</a>
            {% else %}
            <a href="/logout" class="menu-link pure-menu-link">Logout</a>
            {% endif %}
          </li>
        </ul>
      </div>
    </div>

    <div class="pure-u-1 pure-u-md-1-3">
      <form class="form-search pure-form pure-g">
        <div class="pure-u-2-3">
          <input type="text" class="pure-input-rounded pure-input-1" name="search" placeholder="Search" />
        </div>
        <div class="pure-u-1-3">
          <button type="submit" class="button button-search pure-button pure-input-1">Search</button>
        </div>
      </form>
    </div>
  </div>

  <div class="content pure-g">
    {% for video in video_dict %}
    <div class="pure-u-1 pure-u-md-1-3">
      <a href="/watch-video/{{ video.id }}">
        <img src="/image/{{ video.id }}" class="pure-img">
      </a>
    </div>
    <div class="pure-u-1 pure-u-md-2-3">
      <h4>
        <a href="/watch-video/{{ video.id }}">{{ video.title }}</a>
      </h4>
    </div>
    <div class="pure-u-md-1-3"></div>
    <div class="pure-u-2-3">
      <p>
        {% if video.views == "1" %}
        <small>{{ video.views }} view</small>
        {% endif %}
        {% if video.views != "1" %}
        <small>{{ video.views }} views</small>
        {% endif %}
      </p>
    </div>
    <hr class="pure-u-1" />
    {% endfor %}
  </div>
</body>

</html>
