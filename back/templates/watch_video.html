<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>VideoHub</title>
  <link rel="stylesheet" href="/static/css/bootstrap-min-337.css">
  <link rel="stylesheet" href="/static/css/video.css">
  <link rel="stylesheet" href="/static/css/home.css">
  <link rel="icon" href="/static/img/favicon.png" type="image/png">
</head>

<body class="back">
  <nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a style="color: #16A085;" class="navbar-brand" href="/">VideoHub</a>
      </div>
      <form class="ml navbar-form navbar-left" action="search" method="post">
        <div class="form-group">
          <input style="width:500px;" name="search" type="text" class="form-control" placeholder="Search">
        </div>
        <button type="submit" class="bt btn btn-default">Submit</button>
      </form>
      <ul class="nav navbar-nav navbar-right">
        {% if not is_logged %}
        <li><a style="color: #16A085;" href="/login">Login</a></li>
        {% endif %}
        {% if is_logged %}
        <li><a style="color: #16A085;" href="/logout">Logout</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <br><br><br>
  <h1 align="center" class="heading1">{{ title }}</h1>
  <video class="center" controls controlsList="nodownload" autoplay style="position:center;">
    <source src="/video/{{ id }}" type="video/mp4">
    Your browser doesn't support this format.
  </video>
  <br>
  {% if views == "1" %}
  <p style="text-align:center; color:#FFFFFF; font-size:19px;">{{ views }} view</p>
  {% endif %}
  {% if views != "1" %}
  <p style="text-align:center; color:#FFFFFF; font-size:19px;">{{ views }} views</p>
  {% endif %}
</body>

</html>
