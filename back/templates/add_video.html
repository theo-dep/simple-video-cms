<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Video Upload - {{ website_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/third-party/pure-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/third-party/MultiSelect.css" type="text/css">
  <link rel="stylesheet" href="/static/css/styles.css" type="text/css">
  <link rel="stylesheet" href="/static/css/upload.css" type="text/css">
  <script type="text/javascript" src="/static/js/upload.js"></script>
  <script type="text/javascript" src="/static/js/button.js"></script>
  <link rel="icon" href="{{ icon }}" type="image/png">
</head>

<body>
  <div class="content">
    <div class="info">
      <a href="/">
        <h1>{{ website_name }}</h1>
      </a>

      <h3>Upload video</h3>

      <form class="pure-form pure-form-aligned" action="/add-video" method="post" enctype=multipart/form-data>
        <fieldset>
          <div class="pure-control-group file-drop-area">
            <span class="fake-button">{{ button_video_text_helper }}</span>
            <span class="file-message">{{ video_text_helper }}</span>
            <input class="pure-input-1 file-input" type="file" accept="video/mp4" name=file>
          </div>
          <div class="pure-control-group">
            <input class="pure-input-1" type="text" name="title" id="title" placeholder="{{ video_title_placeholder }}"
              required>
          </div>

          <!-- Optional checklist of usernames -->
          {% if user_dict %}
          <div class="pure-control-group">
            <select id="user_ids" name="user_ids" class="pure-input-1" multiple
              data-placeholder="Select usernames (optional):">
              {% for user in user_dict %}
              <option value="{{ user.id }}">{{ user.name }}</option>
              {% endfor %}
            </select>
          </div>
          {% endif %}

          <div class="pure-control-group">
            <button id="upload-button" class="pure-input-1 button pure-button">Upload</button>
          </div>
        </fieldset>
      </form>
    </div>
  </div>

  <script type="text/javascript" src="/static/js/third-party/MultiSelect.js"></script>
  <script>
    new MultiSelect(document.getElementById('user_ids'));
  </script>
</body>

</html>
