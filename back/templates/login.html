<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Login - {{ website_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/third-party/pure-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/styles.css" type="text/css">
  <link rel="stylesheet" href="/static/css/alert.css" type="text/css">
  <script type="text/javascript" src="/static/js/alert.js"></script>
  <script type="text/javascript" src="/static/js/button.js"></script>
  <script type="text/javascript" src="/static/js/password.js"></script>
  <link rel="icon" href="{{ icon }}" type="image/png">
</head>

<body>
  <div class="content">
    <div class="info">
      <a href="/">
        <h1>{{ website_name }}</h1>
      </a>

      <form class="pure-form pure-form-aligned" action="/login" method="post">
        <fieldset>
          {% if login_error %}
          <div class="alert pure-control-group">
            <svg class="close-button">
              <title>Close</title>
              <use href="/static/img/x.svg#x" />
            </svg>
            <p>Invalid credentials</p>
          </div>
          {% endif %}
          <div class="pure-control-group">
            <input class="pure-input-1" type="text" name="username" placeholder="username" required autofocus />
          </div>
          <div class="pure-control-group">
            <input class="pure-input-1" type="password" name="password" placeholder="password" required />
          </div>
          <div class="pure-control-group">
            <button id="login-button" class="pure-input-1 button pure-button">Login</button>
          </div>
        </fieldset>
      </form>

      <div class="add-user">
        <a onclick="showAddPasswordDiv()">Forgot password?</a>
      </div>
      <div class="add-user" id="forgot-password" style="visibility: hidden;">
        Ask an admin to reset your password
      </div>

      <h4 class="lined">Or</h4>

      <h3>First connection?</h3>

      <form class="pure-form pure-form-aligned" action="/login" method="post">
        <div class="pure-control-group">
          <input class="pure-input-1" type="text" name="username" placeholder="enter a valid username" />
        </div>
        <div class="pure-control-group">
          <button id="add-password" class="pure-input-1 button pure-button">Create</button>
        </div>
      </form>

    </div>
  </div>

  <script>
    function showAddPasswordDiv() {
      const forgotPasswordDiv = document.getElementById('forgot-password');
      if (forgotPasswordDiv.style.visibility === "hidden") {
        forgotPasswordDiv.style.visibility = "visible";
      } else {
        forgotPasswordDiv.style.visibility = "hidden";
      }
    }
  </script>

</body>

</html>
