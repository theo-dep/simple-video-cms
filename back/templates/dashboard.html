<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Administrator Dashboard</title>
  <link rel="stylesheet" href="/static/css/bootstrap-min-337.css">
  <link rel="stylesheet" href="/static/css/user_list.css">
  <link rel="icon" href="/static/img/favicon.png" type="image/png">
</head>

<body class="back">
  <nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a style="color: #16A085;" class="navbar-brand" href="/">VideoHub</a>
      </div>
      <ul class="nav navbar-nav navbar-right">
        <li><a style="color: #16A085;" href="/add-admin">Add Administrator</a></li>
        <li><a style="color: #16A085;" href="/user-list">User List</a></li>
        <li><a style="color: #16A085;" href="/video-list">Video List</a></li>
        <li><a style="color: #16A085;" href="/logout">Logout</a></li>
      </ul>
    </div>
  </nav>
  <br><br><br>
  <h2 style="color:#16A085; text-align:center;">VideoHub Statistics</h2>
  <br><br>
  <div class="table-responsive-vertical shadow-z-1">
    <table id="table" class="table table-hover">
      <tbody>
        <tr>
          <td style="color:#FFFFFF;" data-title="view_count">Total number of users registered</td>
          <td data-title="v_count">
            <a style="color:#16A085; text-decoration:none;" href="/user-list">{{ user_count }}</a>
          </td>
        </tr>
        <tr>
          <td style="color:#FFFFFF;" data-title="video_count">Total number of videos uploaded</td>
          <td style="color:#FFFFFF;" data-title="count">
            <a style="color:#16A085; text-decoration:none;" href="/video-list">{{ video_count }}</a>
          </td>
        </tr>
        <tr>
          <td style="color:#FFFFFF;" data-title="view_count">Total number of views</td>
          <td style="color:#FFFFFF;" data-title="v_count">{{ view_count }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>

</html>
