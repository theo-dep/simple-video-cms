<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Group List - {{ website_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/third-party/pure-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/third-party/grids-responsive-min.css" type="text/css">
  <link rel="stylesheet" href="/static/css/styles.css" type="text/css">
  <link rel="icon" href="{{ icon }}" type="image/png">
</head>

<body>
  <div class="header pure-g">
    <div class="pure-u-1 pure-u-md-1-5 pure-menu pure-menu-horizontal">
      <a href="/" class="menu-link pure-menu-heading pure-menu-link">{{ website_name }}</a>
    </div>

    <div class="pure-u-1 pure-u-md-4-5 menu-scrollable pure-menu pure-menu-horizontal pure-menu-scrollable">
      <ul class="menu-scrollable-list pure-menu-list">
        <li class="pure-menu-item">
          <a href="/" class="menu-link pure-menu-link">Home</a>
        </li>
        <li class="pure-menu-item">
          <a href="/dashboard" class="menu-link pure-menu-link">Dashboard</a>
        </li>
        <li class="pure-menu-item">
          <a href="/video-list" class="menu-link pure-menu-link">Video List</a>
        </li>
        <li class="pure-menu-item">
          <a href="/admin-list" class="menu-link pure-menu-link">Admin List</a>
        </li>
        <li class="pure-menu-item">
          <a href="/user-list" class="menu-link pure-menu-link">User List</a>
        </li>
        <li class="pure-menu-item">
          <a href="/group-list" class="menu-link menu-selected pure-menu-link pure-menu-selected">Group List</a>
        </li>
        <li class="pure-menu-item">
          <a href="/logout" class="menu-link pure-menu-link">Logout</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="content">
    <h2>List of groups</h2>
    <table id="table" class="table pure-table pure-table-horizontal">
      <thead>
        <tr>
          <th>Name</th>
          <th class="add-user">
            <a href="/add-group">
              <svg class="svg-button">
                <title>Add a new group</title>
                <use href="/static/img/group-add.svg#group-add" />
              </svg>
            </a>
          </th>
        </tr>
      </thead>
      <tbody>
        {% for group in group_dict %}
        <tr>
          <td data-title="Name">{{ group.name }}</td>
          <td>
            <div class="pure-g">
              <div class="pure-u-1 pure-u-sm-1-2">
                <a href="/update-group/{{ group.id }}">Update</a>
              </div>
              <div class="pure-u-1 pure-u-sm-1-2">
                <a href="/delete-group/{{ group.id }}">Delete</a>
              </div>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>

</html>
