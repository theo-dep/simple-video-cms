default:
  image: ubuntu:26.04

stages:
  - .pre
  - build
  - test
  - lint
  - review
  - deploy

variables:
  CONTAINER_BASE_IMAGE: $CI_REGISTRY/theo/simple-video-cms
  CONTAINER_CI_IMAGE: $CONTAINER_BASE_IMAGE/ci:clang-22
  CONTAINER_TEST_IMAGE: $CONTAINER_BASE_IMAGE:$CI_COMMIT_REF_SLUG
  CONTAINER_RELEASE_IMAGE: $CONTAINER_BASE_IMAGE:$CI_COMMIT_SHORT_SHA

include:
  - local: /.gitlab-ci/.pre.yml
  - local: /.gitlab-ci/build.yml
  - local: /.gitlab-ci/docker.yml
  - local: /.gitlab-ci/lint.yml
  - local: /.gitlab-ci/test.yml
  - local: /.gitlab-ci/deploy.yml
