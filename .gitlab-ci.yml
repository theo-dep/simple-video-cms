default:
  image: ubuntu:26.04

stages:
  - .pre
  - build
  - lint
  - review
  - release

variables:
  CONTAINER_CI_IMAGE: $CI_REGISTRY/theo/simple-video-cms/ci:clang-22
  CONTAINER_TEST_IMAGE: $CI_REGISTRY/theo/simple-video-cms:$CI_COMMIT_REF_SLUG
  CONTAINER_RELEASE_IMAGE: $CI_REGISTRY/theo/simple-video-cms:latest

.merge-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.deploy-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: /.gitlab-ci/build.yml
  - local: /.gitlab-ci/docker.yml
  - local: /.gitlab-ci/lint.yml

build ci image:
  stage: .pre
  extends:
    - .docker-job
  rules:
    - !reference [.merge-rules, rules]
    - !reference [.deploy-rules, rules]
  script:
    - docker build -f container/ci.containerfile -t $CONTAINER_CI_IMAGE .
    - docker push $CONTAINER_CI_IMAGE

debug build:
  image: $CONTAINER_CI_IMAGE
  extends:
    - .build-job
    - .merge-rules
  variables:
    BUILD: debug

release build:
  image: $CONTAINER_CI_IMAGE
  extends:
    - .build-job
  rules:
    - !reference [.merge-rules, rules]
    - !reference [.deploy-rules, rules]
  variables:
    BUILD: release

docker build:
  stage: build
  extends:
    - .docker-job
  needs:
    - job: release build
      artifacts: true
  rules:
    - !reference [.merge-rules, rules]
    - !reference [.deploy-rules, rules]
  script:
    - docker build -f container/Containerfile -t $CONTAINER_TEST_IMAGE dist
    - docker push $CONTAINER_TEST_IMAGE

lint:
  image: $CONTAINER_CI_IMAGE
  extends:
    - .lint-job
    - .merge-rules

deploy review:
  stage: review
  extends:
    - .merge-rules
    - .docker-job
  variables:
    CONTAINER_NAME: review-$CI_COMMIT_REF_SLUG
  before_script:
    - !reference [.docker-job, before_script]
    - apk add --no-cache curl
  script:
    - docker pull $CONTAINER_TEST_IMAGE
    - docker rm -f "$CONTAINER_NAME" || true
    - docker run -d --name "$CONTAINER_NAME" -P $CONTAINER_TEST_IMAGE
    - 'export PORT=$(docker port "$CONTAINER_NAME" 8080/tcp | cut -d: -f2)'
    - export HOST=$(curl -4 ifconfig.me)
    - echo "Deployed on http://$HOST:$PORT"
  environment:
    name: review/$CI_COMMIT_REF_NAME
    url: http://$HOST:$PORT
    on_stop: stop review
    auto_stop_in: 1 week

stop review:
  stage: review
  when: manual
  extends:
    - .docker-job
  variables:
    CONTAINER_NAME: review-$CI_COMMIT_REF_SLUG
  script:
    - docker rm -f "$CONTAINER_NAME" || true
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop

docker release image:
  stage: release
  dependencies: []
  extends:
    - .docker-job
    - .deploy-rules
  script:
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE
