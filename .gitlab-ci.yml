default:
  image: ubuntu:25.10

stages:
  - build
  - analyze
  - release

variables:
  GIT_STRATEGY: clone
  FF_ENABLE_JOB_CLEANUP: true
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: true
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 3
  CONTAINER_TEST_BACK_IMAGE: $CI_REGISTRY/theo/simple-video-cms:back-$CI_COMMIT_SHORT_SHA
  CONTAINER_TEST_FRONT_IMAGE: $CI_REGISTRY/theo/simple-video-cms:front-$CI_COMMIT_SHORT_SHA
  CONTAINER_RELEASE_BACK_IMAGE: $CI_REGISTRY/theo/simple-video-cms:back-latest
  CONTAINER_RELEASE_FRONT_IMAGE: $CI_REGISTRY/theo/simple-video-cms:front-latest

.merge-rules: &merge-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.deploy-rules: &deploy-rules
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: /.gitlab-ci/build.yml
  - local: /.gitlab-ci/analyze.yml

debug_build_back:
  extends:
    - .back-local-build
  variables:
    DEBUG: 1
    BUILD: debug
    TARGET: back

debug_build_front:
  extends:
    - .local-build
  variables:
    DEBUG: 1
    BUILD: debug
    TARGET: front

release_build_back:
  extends:
    - .back-local-build
    - .merge-rules
  variables:
    DEBUG: 0
    BUILD: release
    TARGET: back

release_build_front:
  extends:
    - .local-build
    - .merge-rules
  variables:
    DEBUG: 0
    BUILD: release
    TARGET: front

docker_build:
  stage: build
  extends:
    - .base-tag
    - .merge-rules
  image:
    name: docker:29.1.3-cli
  services:
    - docker:29.1.3-dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache docker-compose
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker-compose build
    - docker tag simple-video-cms-back:latest $CONTAINER_TEST_BACK_IMAGE
    - docker tag simple-video-cms-front:latest $CONTAINER_TEST_FRONT_IMAGE
    - docker push $CONTAINER_TEST_BACK_IMAGE
    - docker push $CONTAINER_TEST_FRONT_IMAGE

analyze_common:
  extends:
    - .analyze
    - .merge-rules
  variables:
    TARGET: common

analyze_front:
  extends:
    - .analyze
    - .merge-rules
  variables:
    TARGET: front

analyze_back:
  extends:
    - .back-analyze
    - .merge-rules
  variables:
    TARGET: back

docker_release_image:
  stage: release
  extends:
    - .base-tag
    - .deploy-rules
  script:
    - docker pull $CONTAINER_TEST_BACK_IMAGE
    - docker pull $CONTAINER_TEST_FRONT_IMAGE
    - docker tag $CONTAINER_TEST_BACK_IMAGE $CONTAINER_RELEASE_BACK_IMAGE
    - docker tag $CONTAINER_TEST_FRONT_IMAGE $CONTAINER_RELEASE_FRONT_IMAGE
    - docker push $CONTAINER_RELEASE_BACK_IMAGE
    - docker push $CONTAINER_TEST_FRONT_IMAGE
