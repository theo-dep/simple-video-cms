default:
  image: ubuntu:24.10

stages:
  - build
  - analyse

variables:
  GIT_STRATEGY: clone
  FF_ENABLE_JOB_CLEANUP: true

.back-variables: &back-variables
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: true
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 3

.merge-rules: &merge-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: /.gitlab-ci/build.yml
  - local: /.gitlab-ci/analyse.yml

debug_build_back:
  extends:
    - .back-local-build
  variables:
    <<: *back-variables
    DEBUG: 1
    BUILD: debug
    TARGET: back

debug_build_front:
  extends:
    - .local-build
  variables:
    DEBUG: 1
    BUILD: debug
    TARGET: front

release_build_back:
  extends:
    - .back-local-build
    - .merge-rules
  variables:
    <<: *back-variables
    DEBUG: 0
    BUILD: release
    TARGET: back

release_build_front:
  extends:
    - .local-build
    - .merge-rules
  variables:
    DEBUG: 0
    BUILD: release
    TARGET: front

docker_build:
  stage: build
  extends:
    - .base-tag
    - .merge-rules
  before_script:
    - apt-get update
    - apt-get -y install docker docker-compose
  script:
    - docker-compose build
  variables: *back-variables

analyse_common:
  extends:
    - .analyse
    - .merge-rules
  variables:
    TARGET: common

analyse_front:
  extends:
    - .analyse
    - .merge-rules
  variables:
    TARGET: front

analyse_back:
  extends:
    - .back-analyse
    - .merge-rules
  variables:
    <<: *back-variables
    TARGET: back
