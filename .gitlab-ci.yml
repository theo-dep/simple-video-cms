default:
  image: ubuntu:25.10

stages:
  - build
  - analyze

variables:
  GIT_STRATEGY: clone
  FF_ENABLE_JOB_CLEANUP: true
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: true
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 3

.merge-rules: &merge-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: /.gitlab-ci/build.yml
  - local: /.gitlab-ci/analyze.yml

debug_build_back:
  extends:
    - .back-local-build
  variables:
    DEBUG: 1
    BUILD: debug
    TARGET: back

debug_build_front:
  extends:
    - .local-build
  variables:
    DEBUG: 1
    BUILD: debug
    TARGET: front

release_build_back:
  extends:
    - .back-local-build
    - .merge-rules
  variables:
    DEBUG: 0
    BUILD: release
    TARGET: back

release_build_front:
  extends:
    - .local-build
    - .merge-rules
  variables:
    DEBUG: 0
    BUILD: release
    TARGET: front

docker_build:
  stage: build
  extends:
    - .base-tag
    - .merge-rules
  image:
    name: docker:29.1.3
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache docker-compose
  script:
    - docker-compose build

analyze_common:
  extends:
    - .analyze
    - .merge-rules
  variables:
    TARGET: common

analyze_front:
  extends:
    - .analyze
    - .merge-rules
  variables:
    TARGET: front

analyze_back:
  extends:
    - .back-analyze
    - .merge-rules
  variables:
    TARGET: back
