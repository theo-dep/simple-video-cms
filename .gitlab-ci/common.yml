.base-tag:
  tags:
    - linux
    - docker

.base-job:
  extends:
    - .base-tag
  before_script:
    - apt-get update
    - apt-get -y install make g++

.back-base-job:
  before_script:
    - !reference [.base-job, before_script]
    - apt-get -y install nasm gcc
  script:
    - ./configure --zlib
    - make -C back zlib -j
    - ./configure --libpng --ffmpeg
  tags: !reference [.base-job, tags]
