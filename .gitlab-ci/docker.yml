include:
  - local: /.gitlab-ci/common.yml

.docker-job:
  extends:
    - .all-tag
  image:
    name: docker:29.1.3-cli
  services:
    - docker:29.1.3-dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
