include:
  - local: /.gitlab-ci/common.yml

.lint-job:
  stage: lint
  dependencies: []
  extends:
    - .install-job
  before_script:
    - !reference [.install-job, before_script]
    - apt-get -y install clang-tidy-21
  script:
    - cmake --preset lint
    - cmake --build build/lint --parallel 1
    - npx eslint "front/**/*.js"
