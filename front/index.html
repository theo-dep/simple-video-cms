<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A preact web application video content management system and cpp-httplib, FFmpeg, SQLite backend server" />
    <meta name="theme-color" content="#16a085" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Loading</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon-x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/icons/apple-touch-icon-x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/apple-touch-icon-x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/assets/icons/apple-touch-icon-x120.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/assets/icons/apple-touch-icon-x76.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/assets/icons/apple-touch-icon-x60.png" />
    <link rel="apple-touch-startup-image" href="/assets/icons/apple-touch-startup-image.png" />

    <link rel="stylesheet" href="/node_modules/video.js/dist/video-js.css" />
    <link rel="stylesheet" href="/node_modules/videojs-mobile-ui/dist/videojs-mobile-ui.css" />
    <link rel="stylesheet" href="/node_modules/videojs-yt-style/dist/videojs-yt-style.css" />
    <link rel="stylesheet" href="/assets/index.css" />
    <link rel="icon" href="/assets/img/icon.svg" type="image/png" />
    <script type="importmap">
      {
        "imports": {
          "preact": "/node_modules/preact/dist/preact.mjs",
          "preact/hooks": "/node_modules/preact/hooks/dist/hooks.mjs",
          "preact/compat": "/node_modules/preact/compat/dist/compat.mjs",
          "htm": "/node_modules/htm/dist/htm.mjs",
          "htm/preact": "/node_modules/htm/preact/index.mjs",
          "preact-iso": "/node_modules/preact-iso/src/index.js",
          "preact-iso/router": "/node_modules/preact-iso/src/router.js",
          "preact-iso/lazy": "/node_modules/preact-iso/src/lazy.js",
          "@preact/signals": "/node_modules/@preact/signals/dist/signals.mjs",
          "@preact/signals-core": "/node_modules/@preact/signals-core/dist/signals-core.mjs",
          "fuse.js": "/node_modules/fuse.js/dist/fuse.mjs",
          "video.js": "/build/video.es.js",
          "videojs-yt-style": "/build/videojs-yt-style.js",
          "videojs-mobile-ui": "/build/videojs-mobile-ui.js"
        }
      }
    </script>
    <!-- loader inline style to show fast -->
    <style>
      .svg-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .svg-container {
        width: 25vw;
        height: 25vh;
      }

      .svg-container svg {
        width: 100%;
        height: 100%;
        fill: #16a085;
      }
    </style>
  </head>
  <body>
    <template id="loader-template">
      <div class="svg-wrapper">
        <div class="svg-container">
          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <style>
              .spinner_LWk7 {
                animation:
                  spinner_GWy6 1.2s linear infinite,
                  spinner_BNNO 1.2s linear infinite;
              }

              .spinner_yOMU {
                animation:
                  spinner_GWy6 1.2s linear infinite,
                  spinner_pVqn 1.2s linear infinite;
                animation-delay: 0.15s;
              }

              .spinner_KS4S {
                animation:
                  spinner_GWy6 1.2s linear infinite,
                  spinner_6uKB 1.2s linear infinite;
                animation-delay: 0.3s;
              }

              .spinner_zVee {
                animation:
                  spinner_GWy6 1.2s linear infinite,
                  spinner_Qw4x 1.2s linear infinite;
                animation-delay: 0.45s;
              }

              @keyframes spinner_GWy6 {
                0%,
                50% {
                  width: 9px;
                  height: 9px;
                }

                10% {
                  width: 11px;
                  height: 11px;
                }
              }

              @keyframes spinner_BNNO {
                0%,
                50% {
                  x: 1.5px;
                  y: 1.5px;
                }

                10% {
                  x: 0.5px;
                  y: 0.5px;
                }
              }

              @keyframes spinner_pVqn {
                0%,
                50% {
                  x: 13.5px;
                  y: 1.5px;
                }

                10% {
                  x: 12.5px;
                  y: 0.5px;
                }
              }

              @keyframes spinner_6uKB {
                0%,
                50% {
                  x: 13.5px;
                  y: 13.5px;
                }

                10% {
                  x: 12.5px;
                  y: 12.5px;
                }
              }

              @keyframes spinner_Qw4x {
                0%,
                50% {
                  x: 1.5px;
                  y: 13.5px;
                }

                10% {
                  x: 0.5px;
                  y: 12.5px;
                }
              }
            </style>
            <rect class="spinner_LWk7" x="1.5" y="1.5" rx="1" width="9" height="9" />
            <rect class="spinner_yOMU" x="13.5" y="1.5" rx="1" width="9" height="9" />
            <rect class="spinner_KS4S" x="13.5" y="13.5" rx="1" width="9" height="9" />
            <rect class="spinner_zVee" x="1.5" y="13.5" rx="1" width="9" height="9" />
          </svg>
        </div>
      </div>
    </template>

    <div id="boot-loader" aria-live="polite" aria-label="Loading"></div>

    <script>
      (() => {
        const bootLoader = document.getElementById('boot-loader');
        const loaderTemplate = document.getElementById('loader-template');
        bootLoader.innerHTML = loaderTemplate.innerHTML;
      })();
    </script>

    <script>
      (() => {
        /* global __ENV_PLACEHOLDER__ */
        const env = typeof __ENV_PLACEHOLDER__ !== 'undefined' ? __ENV_PLACEHOLDER__ : { websiteName: 'Simple Video CMS' };
        window.__ENV__ = env;
        document.title = `${document.title} | ${env.websiteName}`;

        if (env.iconPath) {
          document.querySelector('link[rel="icon"]').href = env.iconPath;
        }
      })();
    </script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
