volumes:
  data:


services:

  common:
    image: alpine-common
    build:
      context: .
      dockerfile: common/Containerfile
    command: /bin/true

  front:
    build:
      context: ./front
      dockerfile: Containerfile
    environment:
      BACK_SERVER_URL: back:5000
    ports:
      - 8080:8080
    volumes:
      - data:/data
    depends_on:
      - common
      - back

  back:
    build:
      context: ./back
      dockerfile: Containerfile
    volumes:
      - data:/data
    depends_on:
      - common
