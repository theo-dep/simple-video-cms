volumes:
  data:

services:
  front:
    build:
      context: dist
      dockerfile: docker/front.containerfile
    environment:
      BACK_SERVER_URL: back:5000
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - 8080:8080

  back:
    build:
      context: dist
      dockerfile: docker/back.containerfile
    restart: unless-stopped
    volumes:
      - data:/data
