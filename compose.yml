services:

  client:
    build:
      context: ./Client
      dockerfile: Containerfile
    environment:
      SERVER_URL: http://server:8080
    volumes:
      - ./Client/static:/VideoHub/static
    ports:
      - 5000:5000
    depends_on:
      - server

  server:
    build:
      context: ./Server
      dockerfile: Containerfile
    environment:
      MYSQL_ROOT_PASSWORD: "6y51^HsXrNcx"
      MYSQL_DB_URL: db
    volumes:
      - ./Server/templates:/VideoHub/templates
    depends_on:
      - db

  db:
    image: mysql:latest
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    environment:
      MYSQL_ROOT_PASSWORD: "6y51^HsXrNcx"
